{% load static %}

<div class="bg-white shadow-box3 rounded-md transition-all duration-100 text-center hover:shadow-box4">
  <div class="h-[270px] rounded-t-md relative mx-auto overflow-hidden">
    {% if member.image %}
      <img src="{{ member.image.url }}" alt="{{ member.name }}" class="w-full h-full object-cover rounded-t-md" />
    {% else %}
      <img src="{% static 'assets/images/logo/logo-Elmieh.png' %}" alt="" class="w-full h-full object-cover rounded-t-md" />
    {% endif %}
    
    <div class="absolute right-0 top-0 w-full h-full flex flex-col justify-end items-start">
      <!-- دکمه + -->
      <button type="button" class="h-12 w-12 bg-secondary text-white rounded-tr-md flex flex-col items-center justify-center relative z-10 hover-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect opacity="0.01" width="18" height="18" fill="white" />
          <path fill-rule="evenodd" clip-rule="evenodd" d="M9 2.25C9.62132 2.25 10.125 2.75368 10.125 3.375V7.875H14.625C15.2463 7.875 15.75 8.37868 15.75 9C15.75 9.62132 15.2463 10.125 14.625 10.125H10.125V14.625C10.125 15.2463 9.62132 15.75 9 15.75C8.37868 15.75 7.875 15.2463 7.875 14.625V10.125H3.375C2.75368 10.125 2.25 9.62132 2.25 9C2.25 8.37868 2.75368 7.875 3.375 7.875H7.875V3.375C7.875 2.75368 8.37868 2.25 9 2.25Z" fill="white" />
        </svg>
      </button>

      <!-- آیکون‌های شبکه‌های اجتماعی -->
      <ul class="flex justify-center gap-x-2 bg-primary rounded-tr-md transition-all duration-200 absolute bottom-0 right-0 z-0 opacity-0 invisible hover-target">
        {% if member.facebook %}
          <li>
            <a href="{{ member.facebook }}" class="text-xl leading-[1] text-white flex h-12 w-12 items-center justify-center hover:bg-white hover:text-primary rounded-tr-md transition-all duration-200">
              <iconify-icon icon="bxl:facebook"></iconify-icon>
            </a>
          </li>
        {% endif %}
        {% if member.twitter %}
          <li>
            <a href="{{ member.twitter }}" class="text-xl leading-[1] text-white flex h-12 w-12 items-center justify-center hover:bg-white hover:text-primary transition-all duration-200">
              <iconify-icon icon="bxl:twitter"></iconify-icon>
            </a>
          </li>
        {% endif %}
        {% if member.linkedin %}
          <li>
            <a href="{{ member.linkedin }}" class="text-xl leading-[1] flex h-12 w-12 items-center justify-center text-white hover:bg-white hover:text-primary rounded-bl-md transition-all duration-200">
              <iconify-icon icon="bxl:linkedin"></iconify-icon>
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
  <div class="course-content p-6">
    <h4 class="lg:text-2xl text-1xl mb-1 font-bold">{{ member.name }}</h4>
    <div>{{ member.position }}</div>
  </div>
</div>
